<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>8RAS Time Tracker</title>
<style>
body { font-family: sans-serif; background: #1e1e2e; color: #cdd6f4; padding: 16px; margin: 0; }
h1 { font-size: 18px; margin-bottom: 8px; }
button { display: block; width: 100%; margin-bottom: 10px; padding: 10px; border: none; border-radius: 6px; cursor: pointer; background: #89b4fa; color: #1e1e2e; font-weight: bold; font-size: 13px; }
button:hover { opacity: 0.85; }
.tabs { display: flex; gap: 4px; margin-bottom: 16px; }
.tabs button { flex: 1; background: #45475a; color: #cdd6f4; font-size: 12px; }
.tabs button:hover { background: #585b70; }
.timer-display { font-size: 48px; text-align: center; padding: 30px 0; }
.status-text { text-align: center; margin-bottom: 16px; }
ul { padding-left: 0; }
li { padding: 4px 0; border-bottom: 1px solid #45475a; }
</style>
</head>
<body>
<h1>8RAS Time Tracker</h1>
<p id="statusText">Plugin loaded.</p>
</body>
</html>

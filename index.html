<!DOCTYPE html>
<html>
<head><title>8RAS Time Tracker</title></head>
<body>
<h1>8RAS Time Tracker</h1>
<p id="statusText">Plugin loaded.</p>
<script>
(function(){
  var STORAGE_PATH = '/Users/Shared/8ras-data';
  var IDLE_TIMEOUT = 60;
  var SUPPORTED_ACTIONS = [
    'brush', 'penTool', 'move', 'typeCreateOrChange',
    'setNewHue', 'freeTransform', 'pathComponentOperation', 'adjustment'
  ];
  var currentView = 'setup';
  var settings = { idleTimeout: IDLE_TIMEOUT };
  var clickHandlers = {};
  var containerEl = null;
  var idleTimer = null;
  var timerInterval = null;
  var sessionStartTime = null;
  var isActive = false;
  var lastActionTime = null;
  var lastAction = null;
  var metricsEntries = [];
  var _uxpAvailable = false;
  var _resolvedFolder = null;
  var psApp = null;
  try { psApp = require('photoshop').app; } catch(e) {}

  async function getFileSystem() {
    var uxp = require('uxp');
    var session = uxp.storage.session;
    return await session.requestFileSystem();
  }
  async function resolvePath(fileSystem, path) {
    var parts = path.split('/');
    var filtered = [];
    for (var i = 0; i < parts.length; i++) { if (parts[i].length > 0) filtered.push(parts[i]); }
    var current = fileSystem.root;
    for (i = 0; i < filtered.length; i++) {
      try { current = await current.getFolder(filtered[i]); }
      catch (e) { current = await current.createFolder(filtered[i]); }
    }
    return current;
  }
  async function setupStorageFolder() {
    try {
      var fileSystem = await getFileSystem();
      _resolvedFolder = await resolvePath(fileSystem, STORAGE_PATH);
      try { await _resolvedFolder.getFile('metrics.json'); }
      catch (e) { var f = await _resolvedFolder.createFile('metrics.json'); await f.write(JSON.stringify({ entries: [] }), { format: 'text' }); }
      _uxpAvailable = true;
      return true;
    } catch (e) { console.warn('[8RAS] Storage unavailable:', e.message); return false; }
  }
  function readMetrics() {
    if (!_uxpAvailable || !_resolvedFolder) return Promise.resolve({ entries: [] });
    return _resolvedFolder.getFile('metrics.json').then(function(file) {
      return file.read({ format: 'text' }).then(function(content) { return JSON.parse(content); });
    }).catch(function() { return { entries: [] }; });
  }
  function writeMetrics(metrics) {
    if (!_uxpAvailable || !_resolvedFolder) return Promise.resolve();
    return _resolvedFolder.createFile('metrics.json').then(function(file) {
      return file.write(JSON.stringify(metrics, null, 2), { format: 'text' });
    }).catch(function() { return Promise.resolve(); });
  }
  function saveToken(token) {
    if (!_uxpAvailable || !_resolvedFolder) return Promise.resolve();
    return _resolvedFolder.createFile('token.txt').then(function(file) {
      return file.write(token, { format: 'text' });
    }).catch(function() { return Promise.resolve(); });
  }
  function restoreToken() {
    if (!_uxpAvailable || !_resolvedFolder) return Promise.resolve(null);
    return _resolvedFolder.getFile('token.txt').then(function(file) {
      return file.read({ format: 'text' }).then(function(content) { return content.trim(); });
    }).catch(function() { return Promise.resolve(null); });
  }
  function persistSessionData(seconds) {
    if (!_uxpAvailable || !_resolvedFolder) return Promise.resolve();
    var data = JSON.stringify({ active: isActive, startTime: sessionStartTime, elapsed: seconds || 0, lastAction: lastAction });
    return _resolvedFolder.createFile('session.json').then(function(file) {
      return file.write(data, { format: 'text' });
    }).catch(function() { return Promise.resolve(); });
  }
  function restoreSession() {
    if (!_uxpAvailable || !_resolvedFolder) return Promise.resolve(false);
    return _resolvedFolder.getSession ? Promise.resolve(false) : _resolvedFolder.getFile('session.json').then(function(file) {
      return file.read({ format: 'text' }).then(function(content) {
        var data = JSON.parse(content); isActive = data.active; sessionStartTime = data.startTime; lastActionTime = data.lastAction; return true;
      });
    }).catch(function() { return Promise.resolve(false); });
  }
  function resetIdleTimer(now) {
    lastActionTime = now || Date.now();
    if (idleTimer) clearTimeout(idleTimer);
    if (isActive) { idleTimer = setTimeout(function() { pauseTracking(); }, settings.idleTimeout * 1000); }
  }
  function startTracking(action) {
    var i; for (i = 0; i < SUPPORTED_ACTIONS.length; i++) { if (SUPPORTED_ACTIONS[i] === action) break; }
    if (i >= SUPPORTED_ACTIONS.length) return;
    isActive = true; lastAction = action;
    if (!sessionStartTime) sessionStartTime = Date.now();
    resetIdleTimer();
    persistSessionData(getElapsed());
  }
  function pauseTracking() {
    if (!isActive) return;
    var duration = getElapsed();
    if (duration > 0) { metricsEntries.push({ date: new Date(lastActionTime).toISOString(), duration: duration, action: lastAction || 'unknown' }); }
    isActive = false; sessionStartTime = null; updateTimerDisplay();
  }
  function getElapsed() { if (!sessionStartTime) return 0; return Math.floor((Date.now() - sessionStartTime) / 1000); }
  function padStartNum(num, len) { var s = String(num); while (s.length < len) s = '0' + s; return s; }
  function formatTime(totalSeconds) {
    var h = Math.floor(totalSeconds / 3600);
    var m = Math.floor((totalSeconds % 3600) / 60);
    var s = totalSeconds % 60;
    return (h > 0 ? h + ':' : '') + padStartNum(m, h > 0 ? 2 : 1) + ':' + padStartNum(s, 2);
  }
  function addToMetrics(date, duration, action) {
    readMetrics().then(function(metrics) {
      metrics.entries.push({ date: new Date(date).toISOString(), duration: duration, action: action || 'unknown' });
      writeMetrics(metrics);
    });
  }
  function startListening() { try { if (psApp && typeof psApp.addEventListener === 'function') { psApp.addEventListener('notification', onPhotoshopEvent); } } catch(e) {} }
  function stopListening() { try { if (psApp && typeof psApp.removeEventListener === 'function') { psApp.removeEventListener('notification', onPhotoshopEvent); } } catch(e) {} }
  function onPhotoshopEvent(notification) {
    if (!notification || !notification.commandId) return;
    var cmd = notification.commandId;
    var i; for (i = 0; i < SUPPORTED_ACTIONS.length; i++) { if (SUPPORTED_ACTIONS[i] === cmd) break; }
    if (i >= SUPPORTED_ACTIONS.length) return;
    startTracking(cmd); if (currentView === 'timer') { updateTimerDisplay(); }
  }
  function exportToCSV() {
    return readMetrics().then(function(metrics) {
      var csv = 'Date,Action,Duration (seconds)\n';
      for (var i = 0; i < metrics.entries.length; i++) { csv += '"' + metrics.entries[i].date + '",' + metrics.entries[i].action + ',' + metrics.entries[i].duration + '\n'; }
      return csv;
    });
  }
  function render(view) {
    currentView = view || currentView;
    if (!containerEl) return;
    containerEl.innerHTML = '';
    switch (currentView) { case 'setup': renderSetupView(); break; case 'timer': renderMainView(); break; case 'dashboard': renderDashboardView(); break; case 'settings': renderSettingsView(); break; }
    registerNavigation();
  }
  function renderSetupView() {
    var header = document.createElement('div'); header.innerHTML = '<h2>Setup</h2>'; containerEl.appendChild(header);
    var status = document.createElement('p'); status.id = 'statusText'; status.textContent = 'Configure storage and start tracking.'; containerEl.appendChild(status);
    var btnContainer = document.createElement('div'); btnContainer.style.marginTop = '20px';
    var initBtn = createButton('Initialize Storage', 'initStorageBtn'); btnContainer.appendChild(initBtn);
    var startBtn = createButton('Start Tracking', 'startBtn'); btnContainer.appendChild(startBtn);
    containerEl.appendChild(btnContainer);
    registerClick('initStorageBtn', function() {
      setupStorageFolder().then(function(ok) {
        document.getElementById('statusText').textContent = ok ? 'Storage ready! Click Start Tracking.' : 'Storage setup failed.';
      }).catch(function(e) { document.getElementById('statusText').textContent = 'Storage error: ' + e.message; });
    });
    registerClick('startBtn', function() { currentView = 'timer'; render(); startListening(); restoreSession().then(function(restored) { if (restored && isActive) { sessionStartTime = Date.now() - (getElapsed() * 1000); updateTimerDisplay(); } else { sessionStartTime = null; updateTimerDisplay(); } }); });
  }
  function renderMainView() {
    var container = document.createElement('div');
    var tabs = document.createElement('div'); tabs.className = 'tabs';
    var tabNames = ['Timer', 'Dashboard', 'Settings'];
    var ti; for (ti = 0; ti < tabNames.length; ti++) { (function(tabName) { var btn = document.createElement('button'); btn.textContent = tabName; btn.dataset.view = tabName.toLowerCase(); tabs.appendChild(btn); })(tabNames[ti]); }
    container.appendChild(tabs);
    var content = document.createElement('div'); content.id = 'mainContent'; container.appendChild(content);
    containerEl.appendChild(container); renderTimerContent();
  }
  function renderTimerContent() {
    var content = document.getElementById('mainContent'); if (!content) return; content.innerHTML = '';
    var elapsed = getElapsed();
    var timerDisplay = document.createElement('div'); timerDisplay.id = 'timerDisplay'; timerDisplay.style.fontSize = '48px'; timerDisplay.style.textAlign = 'center'; timerDisplay.style.padding = '30px 0'; timerDisplay.textContent = formatTime(elapsed); content.appendChild(timerDisplay);
    var statusInfo = document.createElement('p'); statusInfo.id = 'timerStatus'; statusInfo.textContent = isActive ? 'Active' : 'Paused'; content.appendChild(statusInfo);
    var controls = document.createElement('div'); controls.style.marginTop = '20px';
    var pauseBtn = createButton(isActive ? 'Pause' : 'Resume', 'pauseBtn'); controls.appendChild(pauseBtn);
    var stopBtn = createButton('Stop & Save', 'stopBtn'); controls.appendChild(stopBtn);
    content.appendChild(controls);
    registerClick('pauseBtn', function() { if (isActive) { pauseTracking(); } else { startTracking(lastAction || 'manual'); } updateTimerDisplay(); });
    registerClick('stopBtn', function() { pauseTracking(); stopListening(); currentView = 'setup'; render(); });
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(function() { if (isActive) { updateTimerDisplay(); } }, 1000);
  }
  function updateTimerDisplay() {
    var display = document.getElementById('timerDisplay'); if (display) display.textContent = formatTime(getElapsed());
    var status = document.getElementById('timerStatus'); if (status) status.textContent = isActive ? 'Active' : 'Paused';
  }
  function renderDashboardView() {
    var content = document.getElementById('mainContent'); if (!content) return; content.innerHTML = '';
    var title = document.createElement('h3'); title.textContent = 'Weekly Dashboard (' + metricsEntries.length + ' entries)'; content.appendChild(title);
    var weekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
    var weeklyEntries = []; var ei;
    for (ei = 0; ei < metricsEntries.length; ei++) { if (new Date(metricsEntries[ei].date).getTime() > weekAgo) { weeklyEntries.push(metricsEntries[ei]); } }
    var totalSeconds = 0; for (ei = 0; ei < weeklyEntries.length; ei++) { totalSeconds += weeklyEntries[ei].duration; }
    var summary = document.createElement('p'); summary.textContent = 'This week: ' + formatTime(totalSeconds); content.appendChild(summary);
    var actionCounts = {};
    for (ei = 0; ei < weeklyEntries.length; ei++) { var act = weeklyEntries[ei].action; actionCounts[act] = (actionCounts[act] || 0) + weeklyEntries[ei].duration; }
    var list = document.createElement('ul'); list.style.listStyle = 'none'; list.style.padding = '0';
    var keys = Object.keys(actionCounts); var ki;
    for (ki = 0; ki < keys.length; ki++) { var li = document.createElement('li'); li.textContent = keys[ki] + ': ' + formatTime(actionCounts[keys[ki]]); list.appendChild(li); }
    content.appendChild(list);
    var exportBtn = createButton('Export CSV', 'exportCsvBtn'); content.appendChild(exportBtn);
    registerClick('exportCsvBtn', function() {
      exportToCSV().then(function(csv) {
        var blob = new Blob([csv], { type: 'text/csv' }); var url = URL.createObjectURL(blob);
        var a = document.createElement('a'); a.href = url; a.download = '8ras-export.csv'; a.click(); URL.revokeObjectURL(url);
      });
    });
  }
  function renderSettingsView() {
    var content = document.getElementById('mainContent'); if (!content) return; content.innerHTML = '';
    var title = document.createElement('h3'); title.textContent = 'Settings'; content.appendChild(title);
    var form = document.createElement('form');
    var label = document.createElement('label'); label.textContent = 'Idle timeout (seconds):'; form.appendChild(label);
    var input = document.createElement('input'); input.type = 'number'; input.id = 'timeoutInput'; input.value = settings.idleTimeout; input.min = '10'; input.max = '3600'; form.appendChild(input);
    var saveBtn = createButton('Save Settings', 'saveSettingsBtn'); form.appendChild(saveBtn);
    content.appendChild(form);
    registerClick('saveSettingsBtn', function() { var val = parseInt(input.value, 10); if (val >= 10 && val <= 3600) { settings.idleTimeout = val; alert('Settings saved!'); } else { alert('Please enter a value between 10 and 3600.'); } });
  }
  function registerNavigation() {
    var tabs = containerEl.querySelector('.tabs'); if (!tabs) return;
    var buttons = tabs.querySelectorAll('button[data-view]'); var bi;
    for (bi = 0; bi < buttons.length; bi++) { (function(btn) { registerClick(btn.dataset.view + 'Tab', function() { currentView = btn.dataset.view; if (timerInterval) clearInterval(timerInterval); timerInterval = null; render(); }); })(buttons[bi]); }
  }
  function createButton(text, id) {
    var btn = document.createElement('button'); btn.textContent = text; btn.id = id;
    btn.style.display = 'block'; btn.style.width = '100%'; btn.style.marginBottom = '10px';
    btn.style.padding = '10px'; btn.style.border = 'none'; btn.style.borderRadius = '6px';
    btn.style.cursor = 'pointer'; btn.style.background = '#89b4fa'; btn.style.color = '#1e1e2e';
    btn.style.fontWeight = 'bold'; return btn;
  }
  function registerClick(id, handler) { clickHandlers[id] = handler; }
  function dispatchClick(event) {
    var target = event.target;
    while (target && target !== containerEl) { if (clickHandlers[target.id]) { clickHandlers[target.id](event); return; } target = target.parentNode; }
  }
  function init(appContainer) {
    try {
      containerEl = appContainer;
      if (!containerEl) return;
      containerEl.addEventListener('click', dispatchClick.bind(containerEl));
      var style = document.createElement('style');
      style.textContent = 'body{font-family:sans-serif;background:#1e1e2e;color:#cdd6f4;padding:16px;margin:0}button:hover{opacity:0.85}button:active{transform:scale(0.98)}.tabs{display:flex;gap:4px;margin-bottom:16px}.tabs button{flex:1;padding:8px;border:none;border-radius:4px;background:#45475a;color:#cdd6f4;cursor:pointer;font-size:13px}.tabs button:hover{background:#585b70}ul{padding-left:0}li{padding:4px 0;border-bottom:1px solid #45475a}';
      document.head.appendChild(style);
      setupStorageFolder().then(function(ok) { console.log('[8RAS] Storage initialized:', ok); }).catch(function(e) { console.warn('[8RAS] Storage unavailable:', e.message); });
      render('setup');
    } catch (e) {
      console.error('[8RAS] CRITICAL ERROR:', e.message);
      if (containerEl) { containerEl.innerHTML = '<p>Error: ' + e.message + '</p>'; }
    }
  }
  if (typeof document !== 'undefined' && document.body) { init(document.body); }
})();
</script>
</body>
</html>

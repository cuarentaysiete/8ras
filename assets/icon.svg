<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9"/>
      <stop offset="100%" style="stop-color:#5ba0e9"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#4A90D9" stroke-width="2"/>

  <!-- Clock hands -->
  <line x1="32" y1="14" x2="32" y2="32" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="44" y2="38" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="32" cy="32" r="3" fill="#4A90D9"/>

  <!-- Hour markers -->
  <circle cx="32" cy="10" r="1.5" fill="#4A90D9" opacity="0.6"/>
  <circle cx="54" cy="32" r="1.5" fill="#4A90D9" opacity="0.6"/>
  <circle cx="32" cy="54" r="1.5" fill="#4A90D9" opacity="0.6"/>
  <circle cx="10" cy="32" r="1.5" fill="#4A90D9" opacity="0.6"/>
</svg>
